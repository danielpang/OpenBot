# Optional tunnels that give OpenBots a public URL (plan 16.4, README "Exposing
# your OpenBots server to the internet"). Included by the root compose.yaml; each runs
# only with its profile. Set OPENBOTS_PUBLIC_URL in .env to the public URL too.
name: openbots

services:
  # `docker compose --profile ngrok up -d` with NGROK_AUTHTOKEN and NGROK_URL
  # (your static domain, e.g. your-name.ngrok.app) in .env.
  ngrok:
    image: ngrok/ngrok:latest
    profiles: [ngrok]
    restart: unless-stopped
    command: ['http', '--url=${NGROK_URL:-}', 'openbots:3000']
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    depends_on:
      - openbots

  # `docker compose --profile cloudflare up -d` with CLOUDFLARE_TUNNEL_TOKEN in
  # .env. Create the tunnel in the Cloudflare Zero Trust dashboard and point its
  # public hostname at the service http://openbots:3000. With the `relay`
  # profile (docker-compose.relay.yml), add a second public hostname for the
  # service http://relay:3200 and set OPENBOTS_RELAY_URL to wss://<that host>.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: [cloudflare]
    restart: unless-stopped
    command: ['tunnel', '--no-autoupdate', 'run']
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - openbots

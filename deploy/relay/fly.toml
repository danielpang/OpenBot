# The shared OpenBots relay on Fly Machines (deploy/relay/README.md,
# docs/MOBILE_AND_VM_PLAN.md 5.8). Several Machines serve one hostname. Redis
# says which Machine owns each host id; a Machine that gets a connection for a
# host another Machine owns answers with `fly-replay`, and Fly's proxy replays
# it on the owner.
#
#   fly launch --copy-config --no-deploy --name <your app>
#   fly redis create                       # or a Redis Machine on the private network
#   fly secrets set RELAY_REDIS_URL=redis://... RELAY_METRICS_TOKEN=...
#   fly deploy --image <image>             # the first deploy, by hand
#   fly scale count 2 --region iad,fra     # the most Machines the proxy may start
#
# `fly launch` replaces `app` and `primary_region` with yours. After that,
# .github/workflows/deploy-relay.yml builds and deploys the relay on every push
# to main that changes it, as ghcr.io/<owner>/openbots/relay:sha-<commit sha>.

app = "openbots-relay"
primary_region = "iad"

# A deploy or a restart sends SIGTERM. The relay then drains: it reports not
# ready, takes no new upgrades or leases, gives up its leases, and after the
# grace period (RELAY_DRAIN_GRACE_MS, 20 seconds) closes what is left with
# 1012, so servers and phones reconnect to another Machine. The kill timeout
# must outlast the grace period, or Fly kills the Machine mid drain.
kill_signal = "SIGTERM"
kill_timeout = 30

# No [build]: every deploy names its image with --image (the workflow passes
# ghcr.io/<owner>/openbots/relay:sha-<commit sha>), so a `fly deploy` by hand without one
# fails rather than rolling the relay back to an old pinned release. Run
# `fly releases --image` to see which image each release ran.

[deploy]
  # One Machine at a time, so the others take its hosts while it drains.
  strategy = "rolling"
  max_unavailable = 1

[env]
  RELAY_PORT = "3200"
  # Fly's proxy appends the client's address to X-Forwarded-For.
  RELAY_TRUST_PROXY = "true"
  RELAY_DRAIN_GRACE_MS = "20000"
  # The socket ceiling, matched by [http_service.concurrency] below.
  RELAY_MAX_SOCKETS = "20000"
  # Bytes in flight across the Machine's sockets: 512 MiB, inside the
  # Machine's memory below.
  RELAY_BUDGET_BYTES = "536870912"
  # Keep this at 1. A rolling deploy takes one Machine out at a time, and a
  # minimum of 2 would make the last Machine standing report not ready.
  RELAY_MIN_CLUSTER_SIZE = "1"
  RELAY_LOG_LEVEL = "info"
  # Set as secrets, never here (`fly secrets set`; see the README):
  #   RELAY_REDIS_URL       the registry. Required with more than one Machine
  #   RELAY_METRICS_TOKEN   bearer token for GET /metrics. Without it /metrics is 404
  #   RELAY_PRESENCE_TOKEN  optional: bearer token GET /v1/hosts/{id} then wants
  #   RELAY_APNS_KEY_ID, RELAY_APNS_TEAM_ID, RELAY_APNS_TOPIC
  #   RELAY_APNS_KEY        the .p8 key, base64. The relay reads it once at
  #                         start and deletes it from its environment, so no
  #                         key file is written and none needs to be readable
  #                         by the relay's user
  # RELAY_NODE_ID stays unset on Fly: the relay takes the Machine's own
  # FLY_MACHINE_ID, which is what `fly-replay: instance=` names. Replays are on
  # because FLY_MACHINE_ID is set; RELAY_REPLAY need not be.

[http_service]
  internal_port = 3200
  force_https = true
  # Fly's proxy scales between min_machines_running and the Machines the app
  # has (`fly scale count`): it starts a stopped Machine when the running ones
  # pass the soft limit below, and stops one when the rest have room for its
  # load. A stopped Machine gets SIGTERM and drains first (kill_timeout above),
  # so its servers and phones reconnect to the one still running. It never
  # creates Machines, so `fly scale count` sets the most there can be.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  # Counted by connection, as the relay counts its sockets. Past the soft
  # limit the proxy prefers other Machines; at the hard limit it sends none.
  # The relay itself refuses upgrades with 503 at RELAY_MAX_SOCKETS.
  [http_service.concurrency]
    type = "connections"
    soft_limit = 16000
    hard_limit = 20000

  # Not ready while draining or at the socket ceiling: the proxy then sends
  # this Machine nothing new. A Machine without Redis stays ready and serves on
  # alone, so a Redis outage does not take every Machine out at once.
  [[http_service.checks]]
    grace_period = "10s"
    interval = "10s"
    timeout = "2s"
    method = "GET"
    path = "/ready"

# Liveness, reported by `fly checks list`. A top level check never routes or
# stops anything.
[checks]
  [checks.alive]
    type = "http"
    port = 3200
    path = "/healthz"
    method = "get"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

# The byte budget is 512 MiB; 1 GB more covers Node, the sockets' own
# buffers, and headroom.
[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit
      - run: node scripts/check-licenses.mjs
      # The install script, the release, backup and image scripts, and the
      # standalone image's scripts and s6 services (their `up` files are one
      # command line each, checked as sh).
      - name: Lint the shell scripts
        run: |
          shellcheck -x install.sh scripts/*.sh docker/*.sh \
            docker/standalone/lib/*.sh docker/standalone/lib/check-redis \
            docker/standalone/bin/openbots docker/standalone/test/*.sh \
            docker/standalone/s6-rc.d/*/run
          shellcheck -s sh docker/standalone/s6-rc.d/*/up
      - name: Test the standalone image's init checks
        run: bash docker/standalone/test/init-lib.test.sh
      - run: pnpm lint
      - run: pnpm typecheck
      # The committed OpenAPI document and the client generated from it must
      # match the routes: regenerate both and fail on any difference.
      - name: Check the OpenAPI document and client are current
        run: |
          pnpm --filter @openbots/server openapi
          pnpm exec prettier --write packages/api-client/openapi.json
          pnpm --filter @openbots/api-client generate
          if ! git diff --exit-code -- packages/api-client; then
            echo "::error::packages/api-client is stale; run the three commands above and commit the result"
            exit 1
          fi
      # The same for the managed routes (ee/server) and ee/web's types.
      - name: Check the managed OpenAPI document and types are current
        run: |
          pnpm --filter @openbots/ee-server openapi
          pnpm exec prettier --write ee/server/openapi.json
          pnpm --filter @openbots/ee-web generate
          if ! git diff --exit-code -- ee/server/openapi.json ee/web/src/schema.ts; then
            echo "::error::ee/server/openapi.json or ee/web/src/schema.ts is stale; run the three commands above and commit the result"
            exit 1
          fi
      - run: pnpm test
      - run: pnpm build

  # The server tests again, on real Postgres instead of PGlite (db/test-db.ts):
  # with DATABASE_URL set, each test app gets its own database, copied from a
  # migrated template. Real connections run queries side by side where PGlite
  # runs them one at a time, which shows races PGlite hides.
  server-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: openbots
          POSTGRES_PASSWORD: openbots
          POSTGRES_DB: openbots
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U openbots -d openbots"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://openbots:openbots@localhost:5432/openbots
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run test --filter @openbots/server

  server-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      # Every Dockerfile, with the repository's .hadolint.yaml.
      - name: Lint the Dockerfiles
        run: >-
          docker run --rm -v "$PWD:/repo:ro" -w /repo hadolint/hadolint:v2.12.0
          hadolint docker/server.Dockerfile docker/computer.Dockerfile
          docker/sandbox-firewall.Dockerfile docker/relay.Dockerfile
          docker/standalone.Dockerfile ee/server/Dockerfile
      - name: Validate the compose files
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose --profile s3 --profile ngrok --profile cloudflare config --quiet
          docker compose --profile relay config --quiet
          docker compose --project-directory . -f docker/docker-compose.yml -f docker/docker-compose.dev.yml config --quiet
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/server.Dockerfile
          push: false
          load: true
          tags: openbots-ci/server:ci
          cache-from: type=gha,scope=ci-server
          cache-to: type=gha,scope=ci-server,mode=max
      # The relay: built, not published here (release-images.yml publishes
      # it). The standalone image has a job of its own below.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/relay.Dockerfile
          push: false
          load: true
          tags: openbots-ci/relay:ci
          cache-from: type=gha,scope=ci-relay
          cache-to: type=gha,scope=ci-relay,mode=max
      # The managed image (ee/server): built, not published here.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ee/server/Dockerfile
          push: false
          tags: openbots-ci/managed-server:ci
          cache-from: type=gha,scope=ci-managed-server
          cache-to: type=gha,scope=ci-managed-server,mode=max
      - name: Smoke-test the stack
        run: |
          key="$(docker run --rm openbots-ci/server:ci keygen)"
          # As install.sh does: one database password in both places.
          db="$(openssl rand -hex 24)"
          sed -i "s|^OPENBOTS_MASTER_KEY=.*|OPENBOTS_MASTER_KEY=$key|; s|^OPENBOTS_IMAGE_PREFIX=.*|OPENBOTS_IMAGE_PREFIX=openbots-ci|; s|^OPENBOTS_VERSION=.*|OPENBOTS_VERSION=ci|; s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$db|; s|:change-me@|:$db@|" .env
          docker compose up -d --wait
          curl -fsS http://localhost:3000/readyz
          curl -fsS http://localhost:3000/ | grep -q "<title>OpenBots</title>"
      - name: Smoke-test the relay profile
        run: |
          docker compose --profile relay up -d --wait relay
          curl -fsS http://127.0.0.1:3200/healthz
      - if: failure()
        run: docker compose logs

  # The standalone image, built and booted on a volume: first boot, pairing
  # before any owner exists, a backup, a clean stop and a start on the same
  # volume, the volume lock against a second container, and a restore.
  standalone-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      IMAGE: openbots-ci/standalone:ci
      VOLUME: openbots-ci-data
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/standalone.Dockerfile
          push: false
          load: true
          tags: openbots-ci/standalone:ci
          cache-from: type=gha,scope=ci-standalone
          cache-to: type=gha,scope=ci-standalone,mode=max
      - name: Boot it on a volume
        run: |
          cat >"$RUNNER_TEMP/start.sh" <<'EOF'
          set -eu
          docker run -d --name openbots --stop-timeout 60 \
            --log-opt max-size=10m --log-opt max-file=3 --pids-limit 4096 \
            --cap-add NET_ADMIN -v "$VOLUME:/data" -p 127.0.0.1:3000:3000 "$IMAGE"
          for _ in $(seq 1 120); do
            if curl -fsS -o /dev/null http://127.0.0.1:3000/readyz; then exit 0; fi
            if [ "$(docker inspect -f '{{.State.Running}}' openbots)" != true ]; then
              echo "::error::the container stopped"
              exit 1
            fi
            sleep 2
          done
          echo "::error::/readyz did not answer"
          exit 1
          EOF
          docker volume create "$VOLUME"
          bash "$RUNNER_TEMP/start.sh"
          docker logs openbots 2>&1 | grep -q 'Blocked the metadata address'
      - name: Pair before any owner exists
        run: |
          docker exec openbots openbots pair --link | tee "$RUNNER_TEMP/pair.txt"
          grep -q '^openbots://pair#.*setup=1' "$RUNNER_TEMP/pair.txt"
      - name: Back up
        run: |
          docker exec openbots sh -c 'echo kept >/data/home/ci-marker'
          docker exec openbots grep '^OPENBOTS_MASTER_KEY=' /data/.env >"$RUNNER_TEMP/key"
          # A directory that exists is the parent of a new timestamped
          # backup, so the same command runs twice.
          docker exec openbots openbots backup /data/backups
          docker exec openbots openbots backup /data/backups
          [ "$(docker exec openbots sh -c 'ls /data/backups | wc -l')" = 2 ]
          docker exec openbots openbots backup --out /data/backups/ci
          docker exec openbots test -f /data/backups/ci/MANIFEST
      - name: A second container on the volume stops at once
        run: |
          status=0
          timeout 120 docker run --rm -v "$VOLUME:/data" "$IMAGE" >"$RUNNER_TEMP/second.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/second.log"
          [ "$status" != 0 ] && [ "$status" != 124 ]
          grep -q 'another container is using this volume' "$RUNNER_TEMP/second.log"
          curl -fsS -o /dev/null http://127.0.0.1:3000/readyz
      - name: Stop cleanly and start again on the same volume
        run: |
          start="$(date +%s)"
          docker stop -t 60 openbots
          echo "stopped in $(($(date +%s) - start)) seconds"
          [ "$(docker inspect -f '{{.State.ExitCode}}' openbots)" = 0 ] || docker logs --tail 50 openbots
          docker logs openbots 2>&1 | grep -q 'database system is shut down'
          docker rm openbots
          bash "$RUNNER_TEMP/start.sh"
          # The data survived: the key, the Bots' home and the pairing.
          docker exec openbots grep '^OPENBOTS_MASTER_KEY=' /data/.env | cmp - "$RUNNER_TEMP/key"
          [ "$(docker exec openbots cat /data/home/ci-marker)" = kept ]
          pairings="$(docker exec openbots runuser -u postgres -- psql -h /run/postgresql -d openbots -tA -c 'SELECT count(*) FROM device_pairings')"
          [ "$pairings" -ge 1 ]
      - name: Restore
        run: |
          docker exec openbots rm /data/home/ci-marker
          # Without a terminal and without --yes it refuses, changing nothing.
          if docker exec openbots openbots restore /data/backups/ci; then
            echo "::error::restore without --yes and without a terminal went ahead"
            exit 1
          fi
          docker exec openbots openbots restore /data/backups/ci --yes
          curl -fsS -o /dev/null http://127.0.0.1:3000/readyz
          [ "$(docker exec openbots cat /data/home/ci-marker)" = kept ]
      - if: failure()
        run: docker logs openbots || true

  # The Playwright specs in apps/web/e2e against the built server and web app,
  # with Postgres and Redis as services and the scripted model of
  # e2e/fake-model.ts. Each job gets a fresh database. The computer spec
  # skips: there is no Docker provider. The server is the managed one
  # (ee/server, serving ee/web), since specs sign up several users and a
  # self-hosted install closes sign-up after its owner: each user verifies
  # their email with the code the server logs (OPENBOTS_DEV_LOG_EMAIL_LINKS,
  # read from E2E_SERVER_LOG) and creates an organization. The fake model and
  # sign-in servers listen on 127.0.0.1, so OPENBOTS_LOCAL_ENDPOINTS is on.
  # The self-hosted job runs the core server on its default deployment.
  e2e:
    name: e2e (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: basics
            specs: e2e/smoke.spec.ts e2e/bots.spec.ts e2e/computer.spec.ts
          - name: transcript
            specs: e2e/transcript.spec.ts
          - name: tools
            specs: e2e/tools.spec.ts
          - name: groups
            specs: e2e/groups.spec.ts
          - name: routines
            specs: e2e/routines.spec.ts
          - name: artifacts
            specs: e2e/artifacts.spec.ts
          - name: organizations
            specs: e2e/organizations.spec.ts
          - name: self-hosted
            specs: e2e/self-hosted.spec.ts
            deployment: self_hosted
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: openbots
          POSTGRES_PASSWORD: openbots
          POSTGRES_DB: openbots
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U openbots -d openbots"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://openbots:openbots@localhost:5432/openbots
      # Migrations as openbots (the owner), then the server as openbots_app,
      # under row-level security between organizations.
      OPENBOTS_DB_APP_PASSWORD: ci-openbots-app-password
      REDIS_URL: redis://localhost:6379
      OPENBOTS_PUBLIC_URL: http://localhost:3000
      OPENBOTS_DEPLOYMENT: ${{ matrix.deployment || 'managed' }}
      OPENBOTS_SIGNUP_MODE: open
      OPENBOTS_LOCAL_ENDPOINTS: 'true'
      OPENBOTS_DEV_LOG_EMAIL_LINKS: '1'
      E2E: '1'
      # The server serves the built web app, so Playwright reuses it instead
      # of starting the Vite dev server.
      E2E_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @openbots/web exec playwright install --with-deps chromium
      - name: Start the server
        run: |
          mkdir -p "$RUNNER_TEMP/files"
          # The managed server from ee/server; the self-hosted job, the core's.
          main=ee/server/dist/main.js
          [ "$OPENBOTS_DEPLOYMENT" = self_hosted ] && main=apps/server/dist/main.js
          OPENBOTS_MASTER_KEY="$(node apps/server/dist/keygen.js)" \
            OPENBOTS_FILES_DIR="$RUNNER_TEMP/files" \
            nohup node "$main" >"$RUNNER_TEMP/server.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:3000/readyz && exit 0
            sleep 1
          done
          echo "::error::the server did not become ready"
          exit 1
      - name: Run the specs
        working-directory: apps/web
        env:
          SPECS: ${{ matrix.specs }}
          E2E_SERVER_LOG: ${{ runner.temp }}/server.log
        # SPECS is a space-separated list of paths.
        run: |
          read -ra specs <<<"$SPECS"
          pnpm exec playwright test --workers=1 "${specs[@]}"
      - if: failure()
        run: cat "$RUNNER_TEMP/server.log"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.name }}
          path: |
            apps/web/test-results/
            ${{ runner.temp }}/server.log
          retention-days: 7

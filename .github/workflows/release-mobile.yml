# EAS credentials for BOTH the app and notification extension must first be
# provisioned interactively (`eas build:configure`, `eas credentials -p ios`).
# This workflow never publishes an App Store release; submission goes to
# App Store Connect/TestFlight only. Missing credentials get a local JS export.
name: Release iOS app

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      submit:
        description: Submit the signed build to App Store Connect/TestFlight
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-mobile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mobile:
    name: iOS companion
    runs-on: macos-15
    timeout-minutes: 120
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
      EXPO_ASC_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      EXPO_ASC_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER }}
      EXPO_APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EXPO_PUBLIC_EAS_PROJECT_ID }}
      OPENBOTS_ASC_APP_ID: ${{ vars.OPENBOTS_ASC_APP_ID }}
      OPENBOTS_IOS_BUNDLE_ID: ${{ vars.OPENBOTS_IOS_BUNDLE_ID || 'dev.openbots.mobile' }}
      EXPO_PUBLIC_OPENBOTS_CLOUD_URL: ${{ vars.OPENBOTS_CLOUD_URL }}
      OPENBOTS_APNS_ENVIRONMENT: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          IS_TAG: ${{ github.ref_type == 'tag' }}
        run: |
          if [ "$IS_TAG" = true ]; then
            node scripts/release-version.mjs check "$RELEASE_TAG" >>"$GITHUB_ENV"
          else
            node scripts/release-version.mjs current >>"$GITHUB_ENV"
          fi
          echo "OPENBOTS_IOS_BUILD_NUMBER=${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" >>"$GITHUB_ENV"
      - name: Set release app version
        run: echo "OPENBOTS_MOBILE_VERSION=$version" >>"$GITHUB_ENV"
      - name: Test mobile logic
        run: pnpm --filter @openbots/mobile test
      - name: Build workspace packages
        run: pnpm exec turbo run build --filter=@openbots/mobile^...
      - name: Check native configuration and export JavaScript
        working-directory: apps/mobile
        run: |
          pnpm exec expo prebuild --platform ios --no-install
          pnpm exec expo export --platform ios
      - name: Check signing setup
        id: signing
        run: |
          missing=()
          for name in EXPO_TOKEN APPLE_API_KEY_P8_BASE64 EXPO_ASC_KEY_ID EXPO_ASC_ISSUER_ID EXPO_APPLE_TEAM_ID EXPO_PUBLIC_EAS_PROJECT_ID OPENBOTS_ASC_APP_ID; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "signed=true" >>"$GITHUB_OUTPUT"
          elif [ "${#missing[@]}" -eq 7 ]; then
            echo "signed=false" >>"$GITHUB_OUTPUT"
            echo "::notice::No iOS release credentials configured. Exporting JavaScript only; no IPA or TestFlight submission."
          else
            echo "::error::Incomplete iOS signing setup. Missing: ${missing[*]}"
            exit 1
          fi
      - name: Write App Store Connect key
        if: steps.signing.outputs.signed == 'true'
        run: |
          key="$RUNNER_TEMP/OpenBots-AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode >"$key"
          chmod 600 "$key"
          echo "EXPO_ASC_API_KEY_PATH=$key" >>"$GITHUB_ENV"
      - name: Build signed IPA with EAS
        if: steps.signing.outputs.signed == 'true'
        working-directory: apps/mobile
        run: pnpm dlx eas-cli@18.10.0 build --platform ios --profile production --non-interactive --wait --json >eas-build.json
      - name: Submit to TestFlight
        if: steps.signing.outputs.signed == 'true' && (github.event_name == 'push' || inputs.submit)
        working-directory: apps/mobile
        run: |
          build_id="$(node -e 'const fs=require("node:fs"); const builds=JSON.parse(fs.readFileSync("eas-build.json","utf8")); if(!builds[0]?.id) process.exit(1); process.stdout.write(builds[0].id)')"
          pnpm dlx eas-cli@18.10.0 submit --platform ios --profile production --id "$build_id" --non-interactive --wait
      - name: Remove API key
        if: always()
        run: rm -f "$RUNNER_TEMP/OpenBots-AuthKey.p8"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-mobile
          path: |
            apps/mobile/dist
            apps/mobile/eas-build.json
          if-no-files-found: error
          retention-days: 7
      - name: Summarize build scope
        if: always()
        run: |
          {
            echo "### iOS companion"
            echo
            echo "Local checks cover TypeScript logic, Expo native generation and JavaScript export."
            echo "APNs delivery, extension decryption on a locked device, iPhone 12 frame rate and external TestFlight acceptance still require device testing."
          } >>"$GITHUB_STEP_SUMMARY"

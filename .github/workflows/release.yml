# The release (apps/desktop/RELEASING.md). One version tag releases everything
# together:
#
#   git fetch origin
#   git tag v1.2.0 origin/main && git push origin v1.2.0
#
#   version    derives the version from the tag; each build stamps its checkout
#   images     server, computer, sandbox-firewall, relay and standalone for
#              linux/amd64 and linux/arm64, pushed to ghcr.io/<owner>/openbots, plus a
#              `docker load` archive of each per architecture
#              (release-images.yml)
#   mac        the universal DMG, the zip and latest-mac.yml, Developer ID
#              signed and notarized; a release without the Apple secrets
#              fails here (release-mac.yml)
#   bundle     the compose bundle (scripts/release-bundle.sh)
#   release    after all three: the GitHub Release as a draft, every file
#              above and SHA256SUMS uploaded to it, then published, and a
#              check that the images are public
#
# The Mac app's local stack runs the images of its own version, so the release
# (and with it latest-mac.yml) appears only after the images are pushed.
#
# Release builds never run for pull requests or untagged branch pushes.
# Normal PR checks remain in ci.yml.
#
# A manual run with a tag (Actions, Release, Run workflow, tag v1.2.0) retries
# that release: every job builds the tag's commit, whichever branch the run
# was started from, and publishes as the tag's push would have. Only the
# newest tag can be retried, since a release moves `latest`.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:
    inputs:
      tag:
        description: An existing tag to release again (such as v1.2.0)
        type: string
        required: true

concurrency:
  # A retry and the tag's own push are the same release.
  group: release-${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
  # Never cancel a release midway through publishing.
  cancel-in-progress: false

permissions: {}

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      minor: ${{ steps.version.outputs.minor }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      image-prefix: ${{ steps.version.outputs.image-prefix }}
      ref: ${{ steps.version.outputs.ref }}
    steps:
      # A retry builds the tag, not the branch the run was started from. Every
      # tag comes too, to check the retried one is the newest.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Both tag pushes and manual retries require a release tag, regardless
      # of committed manifest versions. There is no untagged dry-run path.
      - name: Resolve the release version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          OWNER: ${{ github.repository_owner }}
          RETRY_TAG: ${{ inputs.tag }}
        run: |
          tag=""
          if [ "$EVENT" = push ]; then
            tag="$GITHUB_REF_NAME"
          elif [ "$EVENT" = workflow_dispatch ] && [ -n "$RETRY_TAG" ]; then
            tag="$RETRY_TAG"
            # Prereleases sort before their release (versionsort.suffix).
            newest="$(git -c versionsort.suffix=- tag --list 'v[0-9]*' --sort=-v:refname | head -n 1)"
            if [ "$tag" != "$newest" ]; then
              echo "::error::Only the newest tag ($newest) can be released again: a release moves the latest image tags and the Mac app's update."
              exit 1
            fi
          fi
          if [ -z "$tag" ]; then
            echo "::error::A release tag is required. Push a version tag or retry an existing tag."
            exit 1
          fi
          {
            node scripts/release-version.mjs from-tag "$tag"
            echo "publish=true"
            echo "image-prefix=ghcr.io/${OWNER,,}/openbots"
            echo "ref=$(git rev-parse HEAD)"
          } >>"$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  images:
    name: Images
    needs: version
    if: needs.version.outputs.publish == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release-images.yml
    with:
      version: ${{ needs.version.outputs.version }}
      minor: ${{ needs.version.outputs.minor }}
      prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
      image-prefix: ${{ needs.version.outputs.image-prefix }}
      publish: true
      ref: ${{ needs.version.outputs.ref }}

  mac:
    name: Mac app
    needs: version
    if: needs.version.outputs.publish == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/release-mac.yml
    with:
      version: ${{ needs.version.outputs.version }}
      publish: true
      ref: ${{ needs.version.outputs.ref }}
    secrets:
      MAC_CERTS_P12_BASE64: ${{ secrets.MAC_CERTS_P12_BASE64 }}
      MAC_CERTS_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
      APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

  bundle:
    name: Compose bundle
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.ref }}
          persist-credentials: false
      - name: Pack the bundle
        env:
          VERSION: ${{ needs.version.outputs.version }}
          IMAGE_PREFIX: ${{ needs.version.outputs.image-prefix }}
        run: |
          archive="$(bash scripts/release-bundle.sh "$VERSION" "$IMAGE_PREFIX" "$RUNNER_TEMP/bundle")"
          tar -tzvf "$archive"
          # The bundle's compose files must resolve on their own.
          mkdir "$RUNNER_TEMP/check"
          tar -xzf "$archive" -C "$RUNNER_TEMP/check"
          cd "$RUNNER_TEMP/check/openbots-$VERSION"
          cp .env.example .env
          docker compose config --quiet
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle
          path: ${{ runner.temp }}/bundle/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ needs.version.outputs.publish == 'true' && 7 || 3 }}

  release:
    name: GitHub Release
    needs: [version, images, mac, bundle]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
      IMAGE_PREFIX: ${{ needs.version.outputs.image-prefix }}
      SIGNED: ${{ needs.mac.outputs.signed }}
      REPOSITORY: ${{ github.repository }}
      OWNER: ${{ github.repository_owner }}
    steps:
      # Every tag, for the notes' "changes since" range.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: ${{ runner.temp }}/assets

      # release-mac.yml fails a release without the Apple secrets; this holds
      # if that ever changes, since electron-updater cannot update an unsigned app.
      - name: Refuse an unsigned Mac app
        if: env.SIGNED != 'true'
        run: |
          echo "::error::The Mac app is not signed and notarized, so the release stops here."
          exit 1

      - name: Check the assets and write SHA256SUMS
        working-directory: ${{ runner.temp }}/assets
        run: |
          expected=(
            "OpenBots-$VERSION-universal.dmg"
            "OpenBots-$VERSION-universal-mac.zip"
            "openbots.rb"
            "openbots-compose-$VERSION.tar.gz"
            latest-mac.yml
          )
          for image in server computer sandbox-firewall relay standalone; do
            for arch in amd64 arm64; do
              expected+=("openbots-$image-$VERSION-linux-$arch.tar.gz")
            done
          done
          status=0
          for file in "${expected[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error::$file is missing"
              status=1
            fi
          done
          limit=$((2 * 1024 * 1024 * 1024))
          for file in *; do
            if [ "$(stat -c %s "$file")" -ge "$limit" ]; then
              echo "::error::$file is over GitHub's 2 GiB limit for a release asset"
              status=1
            fi
          done
          [ "$status" = 0 ] || exit 1
          sha256sum -- * >"$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" SHA256SUMS
          cat SHA256SUMS

      # GHCR makes a new package private and its API cannot change that, so
      # the owner sets each one to public by hand after the first release.
      - name: Check the images are public
        id: public
        run: |
          if result="$(bash scripts/release-check-public.sh "$IMAGE_PREFIX" "$VERSION")"; then
            private=""
          else
            private="$(awk '$2 == "private" { print $1 }' <<<"$result" | paste -sd, - | sed 's/,/, /g')"
          fi
          echo "$result"
          echo "private=$private" >>"$GITHUB_OUTPUT"

      - name: Write the release notes
        env:
          PRIVATE_IMAGES: ${{ steps.public.outputs.private }}
        run: |
          bash scripts/release-notes.sh >"$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      # A new release is made as a draft, every file is uploaded to it, and
      # only then is it published, so electron-updater and the download page
      # never see a release without its files. A rerun or a retry finds the
      # release: a draft is finished the same way; a published one gets its
      # files again with latest-mac.yml last, so the update it names is there
      # before the updater reads it.
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          flags=(--latest)
          if [ "$PRERELEASE" = true ]; then flags=(--prerelease --latest=false); fi
          assets="$RUNNER_TEMP/assets"
          if ! draft="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            gh release create "$TAG" --draft --verify-tag --title "OpenBots $VERSION" \
              --notes-file "$RUNNER_TEMP/notes.md"
            draft=true
          fi
          gh release edit "$TAG" --title "OpenBots $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          find "$assets" -maxdepth 1 -type f ! -name latest-mac.yml -exec gh release upload "$TAG" --clobber {} +
          gh release upload "$TAG" --clobber "$assets/latest-mac.yml"
          if [ "$draft" = true ]; then
            gh release edit "$TAG" --draft=false "${flags[@]}"
          fi

      - name: Summarize
        if: always() && steps.public.outcome == 'success'
        env:
          PRIVATE_IMAGES: ${{ steps.public.outputs.private }}
        run: |
          {
            echo "## OpenBots $VERSION"
            echo
            echo "Release: https://github.com/$REPOSITORY/releases/tag/$TAG"
            echo
            echo "Mac app: Developer ID signed and notarized."
            echo
            if [ -n "$PRIVATE_IMAGES" ]; then
              echo "> [!WARNING]"
              echo "> **These images are private: $PRIVATE_IMAGES.** Installs and the Mac app cannot pull them."
              echo "> GitHub's API cannot change a package's visibility. Open https://github.com/$OWNER?tab=packages,"
              echo "> then for each OpenBots package: Package settings, Change visibility, Public."
              echo "> Then check again: \`bash scripts/release-check-public.sh $IMAGE_PREFIX $VERSION\`"
            else
              echo "Images: all public."
            fi
          } >>"$GITHUB_STEP_SUMMARY"
          for image in ${PRIVATE_IMAGES//,/ }; do
            echo "::warning::$IMAGE_PREFIX/$image is private: make the package public in its settings (Change visibility, Public)"
          done

# Deploys the shared relay (deploy/relay) to Fly on every push to main that
# changes it: the relay's code, its image, its dependencies or its Fly config.
# No tag or release is needed. The image is built here for linux/amd64 (Fly
# Machines' architecture), pushed to GHCR as
#   ghcr.io/<owner in lower case>/openbots/relay:sha-<commit sha>
# and Fly pulls it from there, rolling it out one Machine at a time
# (deploy/relay/fly.toml [deploy]). The package must be public, since Fly
# pulls it without credentials.
#
# Only the sha- tag is pushed: the version tags and latest, which self-hosted
# relays (the compose `relay` profile) pull, still move only with a release
# (release-images.yml).
#
# Secret: FLY_API_TOKEN, a deploy token for the relay's Fly app
# (`fly tokens create deploy -a <app>`). The app is the `app` in fly.toml.
name: Deploy relay

on:
  push:
    branches: [main]
    paths:
      - apps/relay/**
      - docker/relay.Dockerfile
      - docker/relay.Dockerfile.dockerignore
      - deploy/relay/fly.toml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/deploy-relay.yml
  workflow_dispatch:

# One deploy at a time, and never cancelled midway: a newer push waits, then
# deploys its own commit.
concurrency:
  group: deploy-relay
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: Deploy relay
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # CI runs these on the same push, but a deploy must not wait on it or
      # race it, so the relay is checked again before it ships.
      - name: Check the relay
        run: |
          pnpm --filter @openbots/relay typecheck
          pnpm --filter @openbots/relay test

      - name: Name the image
        env:
          SHA: ${{ github.sha }}
          OWNER: ${{ github.repository_owner }}
        run: |
          app="$(sed -n 's/^app *= *"\(.*\)"$/\1/p' deploy/relay/fly.toml)"
          if [ -z "$app" ]; then
            echo "::error::deploy/relay/fly.toml names no app"
            exit 1
          fi
          echo "APP=$app" >>"$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${OWNER,,}/openbots/relay:sha-$SHA" >>"$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/relay.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.title=openbots-relay
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=BUSL-1.1
          provenance: false
          cache-from: type=gha,scope=deploy-relay
          cache-to: type=gha,scope=deploy-relay,mode=max

      - uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # 1.5

      - name: Deploy to Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --config deploy/relay/fly.toml --image "$IMAGE" --wait-timeout 10m

      # A deploy that leaves the relay unreachable at its hostname would fail
      # every pairing, so the job fails instead. /ready answers 503 until the
      # Machine takes connections, so it gets a minute.
      - name: Check the relay answers at its hostname
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS --max-time 10 "https://$APP.fly.dev/healthz" >/dev/null &&
              curl -fsS --max-time 10 "https://$APP.fly.dev/ready" >/dev/null; then
              echo "https://$APP.fly.dev answers"
              exit 0
            fi
            sleep 10
          done
          echo "::error::https://$APP.fly.dev does not answer after the deploy"
          exit 1

      - name: Summarize
        run: |
          {
            echo "### Relay deployed"
            echo
            echo "\`$IMAGE\` on Fly app \`$APP\`."
          } >>"$GITHUB_STEP_SUMMARY"
